name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: node --test lib/*.test.mjs

      - name: Build
        run: npm run build
        env:
          # Valores falsos para o build do Next. Nunca usar chave real aqui.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-fake
